name: XAO Core CI

concurrency:
  group: xao-core-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - xao/recovery-baseline-2026-11-10
  pull_request:
    branches:
      - xao/recovery-baseline-2026-11-10

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DXAO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
