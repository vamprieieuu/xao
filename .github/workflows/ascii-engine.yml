name: XAO ASCII engine

on:
  push:
    branches-ignore: ["ci/ae-build-report"]
  pull_request:
  workflow_dispatch:

env:
  AE_SDK_REPOSITORY: vamprieieuu/Dithering_MAJEED_build_ready
  AE_SDK_COMMIT: ea1f39e974daccd11bec2c3802c9e424f26afdc6
  AE_SDK_SUBDIR: extern/AfterEffectsSDK

jobs:
  core-tests:
    name: Core build and regression tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core, tests and offline renderer
        run: make -j"$(nproc)" all
      - name: Core tests
        run: ./build/xao_core_tests
      - name: ASCII regression tests (129 checks)
        run: ./build/ascii_tests
      - name: Verify portable PiPL metadata generator
        run: |
          python3 ae/pipl_gen.py --header ae/XAO_Ascii.h --rc build/XAO_PiPL.rc --bin build/XAO_PiPL.bin
          python3 tools/verify_aex.py --pipl build/XAO_PiPL.bin --header ae/XAO_Ascii.h
      - name: Upload offline renderer
        uses: actions/upload-artifact@v4
        with:
          name: xao_ascii_cli-linux
          path: build/xao_ascii_cli
          if-no-files-found: error

  windows-aex:
    name: Windows x64 AEX build (Adobe SDK / MAJEED build pattern)
    runs-on: windows-2022
    needs: core-tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC (same toolchain setup as MAJEED)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Check out the pinned Adobe After Effects SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AE_SDK_REPOSITORY }}
          ref: ${{ env.AE_SDK_COMMIT }}
          path: .ae-sdk
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Confirm Adobe SDK and PiPLtool
        shell: pwsh
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE ".ae-sdk/${{ env.AE_SDK_SUBDIR }}"
          foreach ($f in "CMakeLists.txt", "Headers/AE_Effect.h", "Headers/AE_EffectCBSuites.h",
                         "Headers/AE_EffectPixelFormat.h", "Util/Param_Utils.h", "Resources/PiPLtool.exe") {
            if (-not (Test-Path (Join-Path $sdk $f))) { throw "SDK file missing: $f" }
          }
          Write-Host "Adobe SDK root: $sdk"
      - name: Configure (same generator and SDK CMake integration as MAJEED)
        run: cmake -S ae -B build-aex -G "Visual Studio 17 2022" -A x64 -DAE_SDK_PATH="$env:GITHUB_WORKSPACE/.ae-sdk/${{ env.AE_SDK_SUBDIR }}"
      - name: Build XAO ASCII AEX
        run: cmake --build build-aex --config Release --target XAO_ASCII --parallel
      - name: Verify PE, EffectMain export and embedded PiPL
        shell: pwsh
        run: |
          python tools/verify_aex.py build-aex/bin/Release/XAO.aex --header ae/XAO_Ascii.h --debug
      - name: Upload XAO ASCII AEX
        uses: actions/upload-artifact@v4
        with:
          name: XAO-aex-win64
          path: build-aex/bin/Release/XAO.aex
          if-no-files-found: error
