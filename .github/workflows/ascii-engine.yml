name: XAO ASCII AEX

on:
  push:
    branches:
      - xao/ascii-pipl-smartfx-fix-2026-11-12
      - xao/fix-render-black-startup-script-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aex:
    name: Build one XAO.aex (Windows x64)
    runs-on: windows-2022
    steps:
      - name: Checkout XAO
        uses: actions/checkout@v4
      - name: Set up MSVC x64 (MAJEED build environment)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout the exact MAJEED Adobe SDK
        uses: actions/checkout@v4
        with:
          repository: vamprieieuu/Dithering_MAJEED_build_ready
          ref: ea1f39e974daccd11bec2c3802c9e424f26afdc6
          path: .ae-sdk
          persist-credentials: false
      - name: Validate Adobe SDK layout
        shell: pwsh
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE '.ae-sdk/extern/AfterEffectsSDK'
          foreach ($f in 'CMakeLists.txt','Headers/AE_Effect.h','Util/Param_Utils.h') {
            if (-not (Test-Path (Join-Path $sdk $f))) { throw "Missing Adobe SDK file: $f" }
          }
      - name: Clean build output
        shell: pwsh
        run: |
          if (Test-Path build-aex) { Remove-Item build-aex -Recurse -Force }
      - name: Configure CMake (same as MAJEED)
        shell: pwsh
        run: |
          cmake -S ae -B build-aex -G 'Visual Studio 17 2022' -A x64 -DAE_SDK_PATH="$env:GITHUB_WORKSPACE/.ae-sdk/extern/AfterEffectsSDK"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      - name: Build XAO_ASCII
        shell: pwsh
        run: |
          cmake --build build-aex --config Release --target XAO_ASCII --parallel
          if ($LASTEXITCODE -ne 0) { throw 'XAO AEX build failed' }
      - name: Verify the one final AEX file
        shell: pwsh
        run: |
          $aex = 'build-aex/dist/XAO.aex'
          if (-not (Test-Path $aex -PathType Leaf)) { throw "XAO.aex was not produced: $aex" }
          if ((Get-Item $aex).Length -lt 10000) { throw 'XAO.aex is unexpectedly small' }
          python tools/verify_aex.py $aex --header ae/XAO_Ascii.h --debug
          if ($LASTEXITCODE -ne 0) { throw 'XAO.aex verification failed' }
          $file = Get-Item $aex
          $hash = (Get-FileHash $aex -Algorithm SHA256).Hash
          Write-Host "AEX: $($file.FullName)"
          Write-Host "SIZE: $($file.Length) bytes"
          Write-Host "SHA256: $hash"
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content $env:GITHUB_STEP_SUMMARY '### XAO ASCII build succeeded'
            Add-Content $env:GITHUB_STEP_SUMMARY '- Output: XAO.aex'
            Add-Content $env:GITHUB_STEP_SUMMARY ("- Size: {0} bytes" -f $file.Length)
            Add-Content $env:GITHUB_STEP_SUMMARY ("- SHA-256: {0}" -f $hash)
          }
      - name: Upload only XAO.aex
        uses: actions/upload-artifact@v4
        with:
          name: XAO.aex
          path: build-aex/dist/XAO.aex
          if-no-files-found: error
          compression-level: 0
