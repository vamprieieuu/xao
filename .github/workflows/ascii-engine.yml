name: XAO ASCII AEX

on:
  push:
    branches:
      - xao/ascii-pipl-smartfx-fix-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aex:
    name: Build one XAO.aex (Windows x64)
    runs-on: windows-2022
    steps:
      - name: Checkout XAO
        uses: actions/checkout@v4
      - name: Set up Visual Studio 2022 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Checkout the exact MAJEED Adobe SDK
        uses: actions/checkout@v4
        with:
          repository: vamprieieuu/Dithering_MAJEED_build_ready
          ref: ea1f39e974daccd11bec2c3802c9e424f26afdc6
          path: .ae-sdk
          persist-credentials: false
      - name: Validate SDK files
        shell: pwsh
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE '.ae-sdk/extern/AfterEffectsSDK'
          foreach ($f in 'CMakeLists.txt','Headers/AE_Effect.h','Util/Param_Utils.h','Resources/PiPLtool.exe') {
            if (-not (Test-Path (Join-Path $sdk $f))) { throw "Missing Adobe SDK file: $f" }
          }
      - name: Configure x64 AEX
        shell: pwsh
        run: |
          cmake -S ae -B build-aex -G 'Visual Studio 17 2022' -A x64 -DAE_SDK_PATH="$env:GITHUB_WORKSPACE/.ae-sdk/extern/AfterEffectsSDK"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      - name: Build XAO.aex
        shell: pwsh
        run: |
          cmake --build build-aex --config Release --target XAO_ASCII --parallel
          if ($LASTEXITCODE -ne 0) { throw 'AEX build failed' }
      - name: Verify the exact AEX output
        shell: pwsh
        run: |
          $aex = 'build-aex/bin/Release/XAO.aex'
          if (-not (Test-Path $aex -PathType Leaf)) { throw "Expected AEX file missing: $aex" }
          if ((Get-Item $aex).Length -lt 10000) { throw 'XAO.aex is unexpectedly small' }
          python tools/verify_aex.py $aex --header ae/XAO_Ascii.h --debug
          if ($LASTEXITCODE -ne 0) { throw 'AEX verification failed' }
          Write-Host "READY: $((Resolve-Path $aex).Path)"
          Write-Host "SIZE: $((Get-Item $aex).Length) bytes"
          Write-Host "SHA256: $((Get-FileHash $aex -Algorithm SHA256).Hash)"
      - name: Upload only XAO.aex
        uses: actions/upload-artifact@v4
        with:
          name: XAO.aex
          path: build-aex/bin/Release/XAO.aex
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
