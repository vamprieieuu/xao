name: XAO Native AE Build
concurrency:
 group: xao-native-aex-${{ github.ref }}
 cancel-in-progress: true
on:
 workflow_dispatch:
 push:
  branches:
   - xao/recovery-baseline-2026-11-10
  paths:
   - 'CMakeLists.txt'
   - 'core/**'
   - 'tests/**'
   - 'ae/**'
   - '.github/workflows/**'
permissions:
 contents: write
jobs:
 build:
  name: Build XAO AEX
  runs-on: windows-2022
  steps:
   - uses: actions/checkout@v4
     name: Checkout XAO
   - uses: actions/checkout@v4
     name: Checkout MAJEED SDK/build reference
     with:
      repository: vamprieieuu/Dithering_MAJEED_build_ready
      ref: ea1f39e974daccd11bec2c3802c9e424f26afdc6
      path: reference/majeed
   - uses: ilammy/msvc-dev-cmd@v1
     with:
      arch: x64
   - name: Configure
     shell: pwsh
     run: |
      $sdk = Join-Path $env:GITHUB_WORKSPACE "reference/majeed/extern/AfterEffectsSDK"
      if (-not (Test-Path (Join-Path $sdk "Headers/AE_Effect.h"))) { throw "Adobe SDK headers missing from MAJEED reference checkout." }
      cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DXAO_BUILD_TESTS=ON -DXAO_BUILD_AE_PLUGIN=ON "-DXAO_AE_SDK_ROOT=$sdk"
   - name: Build AEX and core
     run: cmake --build build --config Release --parallel
   - name: Test core
     run: ctest --test-dir build -C Release --output-on-failure
   - name: Verify generated PiPL metadata
     run: python ae/verify_pipl.py build/XAOAsciiPiPL.bin
   - name: Verify AEX
     shell: pwsh
     run: |
      $aex = Get-ChildItem build -Filter "XAO.aex" -Recurse -File | Select-Object -First 1
      if (-not $aex) { throw "XAO.aex was not produced." }
      $hash = (Get-FileHash $aex.FullName -Algorithm SHA256).Hash
      Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("AEX {0}; Bytes {1}; SHA256 {2}" -f $aex.FullName,$aex.Length,$hash)
      $exports = dumpbin /exports $aex.FullName | Out-String
      if ($exports -notmatch "EffectMain" -or $exports -notmatch "PluginDataEntryFunction2") { throw "Required AE exports are missing." }
      python ae/verify_aex.py $aex.FullName build/XAOAsciiPiPL.bin
      if ($LASTEXITCODE -ne 0) { throw "Strict AEX verification failed." }
      dumpbin /headers /exports /dependents $aex.FullName
   - name: Publish direct AEX release asset
     uses: softprops/action-gh-release@v2
     with:
      tag_name: xao-build-${{ github.run_number }}
      name: XAO AEX Build ${{ github.run_number }}
      target_commitish: ${{ github.sha }}
      body: Automated XAO native After Effects plugin build. The release asset is the raw .aex file (not a ZIP archive).
      prerelease: true
      draft: false
      files: build/bin/Release/XAO.aex
      fail_on_unmatched_files: true
   - name: Publish direct download link
     if: success()
     shell: pwsh
     env:
      RELEASE_TAG: xao-build-${{ github.run_number }}
      REPOSITORY: ${{ github.repository }}
     run: |
      $downloadUrl = "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/XAO.aex"
      Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## XAO plugin"
      Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "[Download XAO.aex]($downloadUrl)"
