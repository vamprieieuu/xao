services:
  - type: web
    runtime: static
    name: ascii-art-camera
    buildCommand: echo "Static site ready"
    staticPublishPath: ./docs
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Permissions-Policy
        value: "camera=(self)"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
